version: 2

models:
  - name: marts_orders
    description: >
      One row per order from 2025 and 2026, with the units sold
      and the products in the order.
    columns:
      - name: order_date
        description: "Date the order was placed."
        tests: [not_null]
      - name: customer_id
        description: "ID of the customer who placed the order."
        tests: [not_null]
      - name: order_id
        description: "Order ID. Unique."
        tests: [unique, not_null]
      - name: net_sales
        description: "Total value of the order, excluding taxes."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: qty_product
        description: "Total units in the order. 0 if the order has no product line."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: products
        description: "List of the products in the order. Each item has product_id, quantity and total_product_sales."

  - name: marts_orders_segmented
    description: >
      One row per order from 2026, with the segment of the order
      (based on the customer's orders in the 12 months before).
    columns:
      - name: order_date
        description: "Date the order was placed."
        tests: [not_null]
      - name: customer_id
        description: "ID of the customer who placed the order."
        tests: [not_null]
      - name: order_id
        description: "Order ID. Unique."
        tests: [unique, not_null]
      - name: net_sales
        description: "Total value of the order, excluding taxes."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: order_segmentation
        description: "New (no prior order), Returning (1 to 3 prior orders) or VIP (4 or more)."
        tests:
          - not_null
          - accepted_values:
              values: ['New', 'Returning', 'VIP']
